<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cryptocagua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
      :root { --bg: #0a0f1e; }
      body {
        background-color: var(--bg);
        margin: 0;
        font-family: 'Inter', sans-serif;
        color: white;
        overflow-x: hidden;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0f1e;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(59, 130, 246, 0.1);
        border-left-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #error-display {
        display: none;
        position: fixed;
        inset: 0;
        background: #0a0f1e;
        color: #f87171;
        padding: 40px;
        z-index: 10000;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
    <script>
      // Shim para compatibilidad con librerías que esperan process.env
      window.process = { env: { API_KEY: "" } };
      
      // Captura de errores críticos para diagnóstico en pantalla
      window.onerror = function(msg, url, line, col, error) {
        console.error("Global Error:", msg, error);
        const display = document.getElementById('error-display');
        if (display) {
          display.style.display = 'block';
          display.innerText = "ERROR DE EJECUCIÓN:\n" + msg + "\n\nUbicación: " + url + ":" + line + "\nDetalles: " + (error ? error.stack : 'N/A');
        }
        return false;
      };
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@0.21.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="loading-screen">
      <div class="spinner"></div>
      <p style="margin-top: 20px; font-size: 10px; font-weight: 900; letter-spacing: 0.3em; color: #3b82f6; text-transform: uppercase;">Cryptocagua Iniciando</p>
    </div>
    <div id="error-display"></div>
    <div id="root"></div>
</body>
</html>
